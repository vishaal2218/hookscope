[project]
name = "hookscope"
version = "0.1.0"
description = "Paste any video link, get a breakdown of why it works and what to film next."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "mlx-whisper>=0.4.2",
    "pillow>=10.4",
    "yt-dlp>=2026.8.19",
    "gallery-dl>=1.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
